name: CI

# Runs on every push so the repository itself shows whether the project is
# green, rather than asking anyone to take our word for it.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Writing check (no emojis, no dashes)
        run: npm run check:writing
      - name: Types
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
